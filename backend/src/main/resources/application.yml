server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 20
      min-spare: 4
    max-connections: 100
    accept-count: 20

spring:
  application:
    name: fotofetch-backend
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/fotofetch}}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 900000
      connection-timeout: 20000
    
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

# FotoFetch Application Properties
fotofetch:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://fotofetch.vercel.app,http://localhost:5173}
  lambda:
    callback-secret: ${FOTOFETCH_LAMBDA_CALLBACK_SECRET:}
  thumbnail:
    lambda-enabled: ${FOTOFETCH_LAMBDA_THUMBNAIL_ENABLED:true}
  
  aws:
    region: ${AWS_REGION:ap-south-1}
    access-key-id: ${AWS_ACCESS_KEY_ID:your_aws_access_key_id}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:your_aws_secret_access_key}
    s3:
      bucket-name: ${AWS_S3_BUCKET:fotofetch-ai-photos}
      presigned-url-expiration-minutes: 30
    rekognition:
      collection-prefix: fotofetch-event-
      similarity-threshold: 80.0
      max-faces: 50

logging:
  level:
    com.fotofetch: INFO
    org.springframework.security: WARN
    org.springframework.web: INFO
